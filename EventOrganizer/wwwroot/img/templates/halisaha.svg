<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.2" stroke-linecap="round">
  <!-- outer boundary -->
  <rect x="4" y="4" width="92" height="152" rx="2"/>
  <!-- halfway line -->
  <line x1="4" y1="80" x2="96" y2="80"/>
  <!-- center circle -->
  <circle cx="50" cy="80" r="14"/>
  <!-- center spot -->
  <circle cx="50" cy="80" r="1.8" fill="rgba(255,255,255,0.55)" stroke="none"/>
  <!-- top penalty area -->
  <rect x="22" y="4" width="56" height="30"/>
