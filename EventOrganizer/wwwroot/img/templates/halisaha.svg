  <path d="M 4 10 A 6 6 0 0 0 10 4"/>
  <path d="M 96 10 A 6 6 0 0 1 90 4"/>
  <!-- bottom penalty area -->
  <rect x="22" y="126" width="56" height="30"/>
  <!-- bottom goal area -->
  <rect x="35" y="144" width="30" height="12"/>
  <!-- bottom arc -->
  <path d="M 37 126 A 14 14 0 0 0 63 126" stroke-dasharray="3 2"/>
  <!-- bottom goal -->
  <rect x="40" y="154" width="20" height="5" stroke-width="1.8"/>
  <!-- bottom corner arcs -->
  <path d="M 4 150 A 6 6 0 0 1 10 156"/>
  <path d="M 96 150 A 6 6 0 0 0 90 156"/>
</svg>
