  <rect x="35" y="4" width="30" height="12"/>
  <!-- top arc -->
  <path d="M 37 34 A 14 14 0 0 1 63 34" stroke-dasharray="3 2"/>
  <!-- top goal -->
  <rect x="40" y="1" width="20" height="5" stroke-width="1.8"/>
